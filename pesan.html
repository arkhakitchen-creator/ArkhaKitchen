<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan - Arkha Kitchen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animasi loading sederhana */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Hilangkan scrollbar tapi tetap bisa scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- ⚠️ GANTI DENGAN URL DEPLOYMENT APPS SCRIPT ANDA -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgm-Kfn2I-X-yAncqRot8ll_7MiqYHDOoWyPbe5tROY79CFLQxub5mPA9TegEjDvVv/exec";
        const NOMOR_WA_TOKO = "6282140014191"; // Ganti dengan nomor WA Admin (Gunakan awalan 62)
    </script>

    <!-- HEADER PENCARIAN -->
    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-40 shadow-md rounded-b-3xl">
        <div class="max-w-md mx-auto flex justify-between items-center mb-3">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">Arkha Kitchen</h1>
                <p class="text-xs text-indigo-200">Spesial menu rumahan istimewa</p>
            </div>
            <div class="w-10 h-10 bg-white text-indigo-600 rounded-full flex items-center justify-center font-bold text-xl shadow-inner">
                AK
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto mt-4 px-4">
        
        <!-- STATUS LOADING -->
        <div id="loadingMenu" class="flex flex-col items-center justify-center py-10">
            <div class="loader mb-3"></div>
            <p class="text-sm text-slate-500 animate-pulse">Menyiapkan daftar menu segar...</p>
        </div>

        <!-- DAFTAR MENU -->
        <div id="katalogMenu" class="space-y-4 hidden">
            <!-- Menu di-render via JavaScript di sini -->
        </div>

        <!-- FOOTER COPYRIGHT -->
        <footer class="mt-12 mb-4 text-center">
            <p class="text-xs font-semibold text-slate-400">Copyright &copy; 2026 Arkha Kitchen</p>
            <p class="text-[10px] text-slate-400 mt-1">Made with ❤️ for delicious food</p>
        </footer>
    </main>

    <!-- TOMBOL KERANJANG MENGAMBANG (FLOATING CART) -->
    <div id="floatingCart" class="fixed bottom-4 left-0 w-full px-4 z-40 transition-transform duration-300 translate-y-24">
        <div class="max-w-md mx-auto">
            <button onclick="bukaCheckout()" class="w-full bg-indigo-600 shadow-xl shadow-indigo-200 rounded-2xl p-4 flex justify-between items-center text-white active:scale-95 transition-transform">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <i class="fas fa-shopping-bag text-xl"></i>
                        <span id="badgeCart" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-indigo-600">0</span>
                    </div>
                    <div class="text-left">
                        <p class="text-xs font-medium text-indigo-100">Total Belanja</p>
                        <p id="totalCartFloat" class="font-bold text-lg">Rp 0</p>
                    </div>
                </div>
                <div class="font-bold text-sm bg-white text-indigo-600 px-4 py-2 rounded-xl">
                    Lanjut Pesan <i class="fas fa-chevron-right ml-1"></i>
                </div>
            </button>
        </div>
    </div>

    <!-- MODAL CHECKOUT -->
    <div id="modalCheckout" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-3xl h-[85vh] w-full max-w-md mx-auto flex flex-col relative overflow-hidden animate-[slideUp_0.3s_ease-out]">
            
            <div class="p-4 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <h2 class="font-bold text-lg text-slate-800">Ringkasan Pesanan</h2>
                <button onclick="tutupCheckout()" class="w-8 h-8 bg-slate-100 rounded-full text-slate-600 hover:bg-slate-200 font-bold">✕</button>
            </div>

            <!-- Area Scroll Form -->
            <div class="flex-1 overflow-y-auto p-4 no-scrollbar">
                
                <div id="listKeranjang" class="space-y-3 mb-6">
                    <!-- Isi keranjang masuk sini -->
                </div>

                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-6">
                    <div class="flex justify-between items-center text-sm mb-1 text-slate-600">
                        <span>Total Pesanan</span>
                        <span id="subtotalCheckout" class="font-bold">Rp 0</span>
                    </div>
                    <div class="flex justify-between items-center text-lg font-black text-indigo-700 mt-2 pt-2 border-t border-indigo-200">
                        <span>Grand Total</span>
                        <span id="grandTotalCheckout">Rp 0</span>
                    </div>
                </div>

                <h3 class="font-bold text-slate-700 mb-3 text-sm">Informasi Pengiriman</h3>
                <div class="space-y-3 mb-6">
                    <input type="text" id="custNama" placeholder="Nama Lengkap Anda" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50" required>
                    <input type="tel" id="custHp" placeholder="Nomor WhatsApp aktif" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50" required>
                    
                    <select id="custPengiriman" onchange="cekPengiriman()" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-semibold">
                        <option value="Pick-up">🚗 Pick-up (Ambil Sendiri)</option>
                        <option value="Ojol">🛵 Pesan Ojol (GoFood/Grab)</option>
                        <option value="COD">📦 COD (Bayar di Tempat)</option>
                    </select>
                    
                    <textarea id="custAlamat" placeholder="Detail Alamat (Wajib untuk Ojol / COD)..." class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 hidden h-20 resize-none"></textarea>
                </div>

                <h3 class="font-bold text-slate-700 mb-3 text-sm">Metode Pembayaran</h3>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button onclick="pilihPembayaran('Cash')" id="btnPayCash" class="pay-btn border-2 border-slate-200 rounded-xl py-2 px-1 text-xs font-bold text-slate-500 bg-white transition">💵 CASH</button>
                    <button onclick="pilihPembayaran('QRIS')" id="btnPayQris" class="pay-btn border-2 border-slate-200 rounded-xl py-2 px-1 text-xs font-bold text-slate-500 bg-white transition">📱 QRIS</button>
                    <button onclick="pilihPembayaran('Transfer')" id="btnPayTransfer" class="pay-btn border-2 border-slate-200 rounded-xl py-2 px-1 text-xs font-bold text-slate-500 bg-white transition">🏦 TRANSFER</button>
                </div>
                <input type="hidden" id="custPembayaran" value="">

                <!-- Info Pembayaran Dinamis -->
                <div id="infoPembayaranBox" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6 text-center text-sm text-slate-600">
                    <!-- Isi QRIS atau Transfer di-render ke sini -->
                </div>

            </div>

            <!-- Tombol Konfirmasi Bawah -->
            <div class="p-4 bg-white border-t sticky bottom-0 z-10">
                <button onclick="kirimKeWhatsApp()" id="btnKirimWA" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition text-base shadow-lg shadow-emerald-200 flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-xl"></i> Kirim Pesanan ke WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Animasi Slide -->
    <style>
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>

    <script>
        let dataMenu = [];
        let dataPengaturan = {};
        
        // Cek LocalStorage Anti-Hilang
        let keranjang = JSON.parse(localStorage.getItem('arkha_cart')) || {};

        window.onload = () => {
            fetchData();
            updateTampilanKeranjang();
        };

        function fetchData() {
            // Fetch Menu
            fetch(WEB_APP_URL + "?action=getMenu")
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    dataMenu = res.data;
                    renderKatalog();
                }
            });

            // Fetch Pengaturan (QRIS & Bank)
            fetch(WEB_APP_URL + "?action=getPengaturan")
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    dataPengaturan = res.data;
                }
            });
        }

        function renderKatalog() {
            document.getElementById("loadingMenu").classList.add("hidden");
            const wadah = document.getElementById("katalogMenu");
            wadah.classList.remove("hidden");
            wadah.innerHTML = "";

            dataMenu.forEach(menu => {
                const isHabis = (menu.status || "").toLowerCase() === "habis";
                const qtySaatIni = keranjang[menu.id] ? keranjang[menu.id].qty : 0;
                
                let tombolHtml = "";
                if(isHabis) {
                    tombolHtml = `<span class="bg-rose-100 text-rose-600 text-[10px] font-bold px-2 py-1 rounded-md uppercase">Sold Out</span>`;
                } else if(qtySaatIni > 0) {
                    tombolHtml = `
                        <div class="flex items-center gap-3 bg-indigo-50 border border-indigo-100 rounded-lg p-1">
                            <button onclick="kurangItem('${menu.id}')" class="w-6 h-6 bg-white text-indigo-600 font-bold rounded shadow-sm hover:bg-indigo-100">-</button>
                            <span class="font-bold text-sm text-indigo-800 w-4 text-center">${qtySaatIni}</span>
                            <button onclick="tambahItem('${menu.id}', '${menu.nama}', ${menu.harga})" class="w-6 h-6 bg-indigo-600 text-white font-bold rounded shadow-sm hover:bg-indigo-700">+</button>
                        </div>
                    `;
                } else {
                    tombolHtml = `<button onclick="tambahItem('${menu.id}', '${menu.nama}', ${menu.harga})" class="border border-indigo-600 text-indigo-600 font-bold text-xs px-4 py-1.5 rounded-lg hover:bg-indigo-50 transition">Tambah</button>`;
                }

                wadah.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex gap-4 ${isHabis ? 'opacity-60 grayscale' : ''}">
                        <div class="w-20 h-20 bg-slate-200 rounded-xl flex-shrink-0 bg-cover bg-center" style="background-image: url('${menu.gambar || 'https://via.placeholder.com/150?text=Menu'}');"></div>
                        <div class="flex-1 flex flex-col justify-between py-0.5">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm leading-tight">${menu.nama}</h3>
                                <p class="text-xs text-slate-400 mt-0.5">${menu.kategori}</p>
                            </div>
                            <div class="flex justify-between items-end">
                                <p class="font-bold text-indigo-600 text-sm">${formatRupiah(menu.harga)}</p>
                                ${tombolHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function tambahItem(id, nama, harga) {
            if(!keranjang[id]) keranjang[id] = { nama, harga, qty: 0, notes: "" };
            keranjang[id].qty++;
            simpanKeranjang();
        }

        function kurangItem(id) {
            if(keranjang[id]) {
                keranjang[id].qty--;
                if(keranjang[id].qty <= 0) delete keranjang[id];
                simpanKeranjang();
            }
        }

        function simpanKeranjang() {
            localStorage.setItem('arkha_cart', JSON.stringify(keranjang));
            renderKatalog();
            updateTampilanKeranjang();
            if(document.getElementById("modalCheckout").classList.contains("hidden") === false) {
                renderListKeranjangCheckout();
            }
        }

        function updateTampilanKeranjang() {
            const keys = Object.keys(keranjang);
            let totalItem = 0; let totalHarga = 0;
            keys.forEach(k => { totalItem += keranjang[k].qty; totalHarga += (keranjang[k].qty * keranjang[k].harga); });

            const floatCart = document.getElementById("floatingCart");
            if(totalItem > 0) {
                floatCart.classList.remove("translate-y-24");
                document.getElementById("badgeCart").innerText = totalItem;
                document.getElementById("totalCartFloat").innerText = formatRupiah(totalHarga);
            } else {
                floatCart.classList.add("translate-y-24");
                tutupCheckout();
            }
        }

        function bukaCheckout() {
            document.getElementById("modalCheckout").classList.remove("hidden");
            renderListKeranjangCheckout();
        }

        function tutupCheckout() {
            document.getElementById("modalCheckout").classList.add("hidden");
        }

        function renderListKeranjangCheckout() {
            const wadah = document.getElementById("listKeranjang");
            wadah.innerHTML = "";
            let totalHarga = 0;
            
            Object.keys(keranjang).forEach(k => {
                const item = keranjang[k];
                totalHarga += (item.qty * item.harga);
                wadah.innerHTML += `
                    <div class="flex gap-3">
                        <div class="font-bold text-indigo-600 w-6">${item.qty}x</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-sm text-slate-800 leading-tight">${item.nama}</h4>
                                <span class="font-semibold text-sm text-slate-600">${formatRupiah(item.qty * item.harga)}</span>
                            </div>
                            <input type="text" placeholder="Catatan: pedas, tanpa sayur..." value="${item.notes}" onchange="updateNotes('${k}', this.value)" class="w-full mt-1 border-b border-slate-200 text-xs py-1 text-slate-500 outline-none focus:border-indigo-500 bg-transparent">
                        </div>
                    </div>
                `;
            });
            document.getElementById("subtotalCheckout").innerText = formatRupiah(totalHarga);
            document.getElementById("grandTotalCheckout").innerText = formatRupiah(totalHarga);
        }

        function updateNotes(id, note) {
            if(keranjang[id]) keranjang[id].notes = note;
            localStorage.setItem('arkha_cart', JSON.stringify(keranjang));
        }

        function cekPengiriman() {
            const jenis = document.getElementById("custPengiriman").value;
            const alamat = document.getElementById("custAlamat");
            if(jenis === "Ojol" || jenis === "COD") {
                alamat.classList.remove("hidden"); alamat.required = true;
            } else {
                alamat.classList.add("hidden"); alamat.required = false; alamat.value = "";
            }
        }

        function pilihPembayaran(metode) {
            // Reset style tombol
            document.querySelectorAll(".pay-btn").forEach(btn => {
                btn.classList.remove("border-indigo-600", "bg-indigo-50", "text-indigo-700");
                btn.classList.add("border-slate-200", "bg-white", "text-slate-500");
            });
            
            // Set tombol aktif
            const btnAktif = document.getElementById(`btnPay${metode}`);
            btnAktif.classList.remove("border-slate-200", "bg-white", "text-slate-500");
            btnAktif.classList.add("border-indigo-600", "bg-indigo-50", "text-indigo-700");

            document.getElementById("custPembayaran").value = metode;
            
            // Tampilkan Info Dinamis
            const infoBox = document.getElementById("infoPembayaranBox");
            infoBox.classList.remove("hidden");
            
            if(metode === "Cash") {
                infoBox.innerHTML = `<p class="font-bold text-slate-800">Pembayaran Tunai (Cash)</p><p class="text-xs mt-1">Silakan bayar langsung saat pesanan diserahkan.</p>`;
            } else if(metode === "QRIS") {
                const img = dataPengaturan.QRIS_IMAGE_URL || "";
                infoBox.innerHTML = `
                    <p class="font-bold text-slate-800 mb-2">Scan QRIS Berikut</p>
                    ${img ? `<img src="${img}" alt="QRIS" class="w-48 mx-auto rounded-xl border border-slate-200 shadow-sm">` : '<p class="text-xs text-rose-500">Gambar QRIS belum diatur di sistem.</p>'}
                    <p class="text-[10px] mt-2">Selesaikan pembayaran lalu lampirkan bukti transfer di WhatsApp.</p>
                `;
            } else if(metode === "Transfer") {
                const bank = dataPengaturan.BANK_NAME || "BCA";
                const rek = dataPengaturan.BANK_ACC_NUMBER || "-";
                const nama = dataPengaturan.BANK_ACC_HOLDER || "-";
                infoBox.innerHTML = `
                    <p class="font-bold text-slate-800 mb-2">Transfer ke Rekening:</p>
                    <div class="bg-white border rounded-lg p-3 text-left w-full max-w-xs mx-auto">
                        <p class="text-xs text-slate-500">Bank</p>
                        <p class="font-bold text-sm text-indigo-700">${bank}</p>
                        <p class="text-xs text-slate-500 mt-2">No. Rekening</p>
                        <p class="font-bold text-lg tracking-widest text-slate-800">${rek}</p>
                        <p class="text-xs text-slate-500 mt-2">Atas Nama</p>
                        <p class="font-bold text-sm text-slate-800">${nama}</p>
                    </div>
                    <p class="text-[10px] mt-3">Selesaikan pembayaran lalu lampirkan struk di WhatsApp.</p>
                `;
            }
        }

        function kirimKeWhatsApp() {
            const nama = document.getElementById("custNama").value.trim();
            const hp = document.getElementById("custHp").value.trim();
            const pengiriman = document.getElementById("custPengiriman").value;
            const alamat = document.getElementById("custAlamat").value.trim();
            const pembayaran = document.getElementById("custPembayaran").value;

            if(!nama || !hp) { alert("Mohon lengkapi Nama dan No HP Anda."); return; }
            if((pengiriman === "Ojol" || pengiriman === "COD") && !alamat) { alert("Mohon lengkapi alamat detail Anda."); return; }
            if(!pembayaran) { alert("Silakan pilih metode pembayaran terlebih dahulu."); return; }

            let teksWA = `*HALO ARKHA KITCHEN!* 🍳\nSaya mau pesan makanan:\n\n`;
            let total = 0;

            Object.keys(keranjang).forEach(k => {
                const item = keranjang[k];
                total += (item.qty * item.harga);
                teksWA += `▪️ ${item.qty}x *${item.nama}*\n`;
                if(item.notes) teksWA += `   _Catatan: ${item.notes}_\n`;
            });

            teksWA += `\n*TOTAL TAGIHAN: ${formatRupiah(total)}*\n\n`;
            teksWA += `*INFORMASI PEMBELI:*\n`;
            teksWA += `👤 Nama: ${nama}\n`;
            teksWA += `📱 No HP: ${hp}\n`;
            teksWA += `🚚 Pengiriman: ${pengiriman}\n`;
            if(alamat) teksWA += `📍 Alamat: ${alamat}\n`;
            teksWA += `💳 Pembayaran: ${pembayaran}\n\n`;
            
            if(pembayaran !== "Cash") {
                teksWA += `_(Saya akan melampirkan bukti ${pembayaran} di bawah pesan ini)_`;
            } else {
                teksWA += `_(Pembayaran akan dilakukan secara Tunai)_`;
            }

            const waLink = `https://wa.me/${NOMOR_WA_TOKO}?text=${encodeURIComponent(teksWA)}`;
            
            // Hapus keranjang setelah checkout sukses
            localStorage.removeItem('arkha_cart');
            keranjang = {};
            tutupCheckout();
            updateTampilanKeranjang();
            renderKatalog();

            // Arahkan ke WA
            window.location.href = waLink;
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }
    </script>
</body>
</html>
